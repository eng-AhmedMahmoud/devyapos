# Settings only — this is a single-package repo. pnpm v10 reads overrides and
# build allowances from here rather than package.json. The overrides carry the
# audit fixes the bohub-pos workspace had for next@16's pinned postcss/sharp
# (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849, sharp <0.35.0); drop them once
# next bumps its own pins.
overrides:
  sharp: ^0.35.0
  postcss: ^8.5.18
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  unrs-resolver: set this to true or false
