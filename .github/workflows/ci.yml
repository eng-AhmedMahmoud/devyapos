# Quality gates. Deployment is Vercel's auto-deploy on main — CI only has to
# stop a broken build from reaching it (Vercel builds anyway, but a red check
# on the PR is earlier and cheaper than a failed production build).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: pnpm run build
