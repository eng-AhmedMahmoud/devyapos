# pos.movingsystems.tech — the Moving POS marketing site. pos.devya.dev, its
# address until 2026-10-22, sends every request to the same path and query on
# the new host with a 301 ($request_uri carries both), over HTTP and HTTPS alike
# (one hop, never via https://pos.devya.dev).
# Container on loopback :3009 (/home/devya/projects/devya-devyapos).
#
# This file is the whole site as it runs, TLS included. `bash scripts/deploy.sh
# --setup` first issues or expands the one certificate (named
# pos.movingsystems.tech, both names) with `certbot certonly --nginx`, which
# doesn't edit any site file, and only then installs this one.
#
# `http2` on a `listen` applies to every server on the same address:port in
# nginx 1.24, so it turns HTTP/2 on for all the TLS sites on this VPS.

# Connection: upgrade only when the client asks for one, so plain requests
# reuse the upstream keepalive pool (a constant 'upgrade' disables it).
map $http_upgrade $devyapos_connection {
    default upgrade;
    ''      '';
}

upstream devya_devyapos {
    server 127.0.0.1:3009;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name pos.movingsystems.tech;
    # No nginx version in the Server header or on error pages.
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pos.movingsystems.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.movingsystems.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://devya_devyapos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $devyapos_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name pos.devya.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pos.movingsystems.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.movingsystems.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://pos.movingsystems.tech$request_uri;
    }
}

# Plain HTTP: one hop straight to the canonical HTTPS URL. The redirect sits in
# a location, not at server level, so the exact-match challenge location that
# certbot's nginx plugin adds during a renewal still wins.
server {
    listen 80;
    server_name pos.movingsystems.tech pos.devya.dev;
    server_tokens off;

    location / {
        return 301 https://pos.movingsystems.tech$request_uri;
    }
}
