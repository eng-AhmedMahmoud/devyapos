# pos.movingsystems.tech — the Moving POS marketing site. pos.devya.dev, its
# address until 2026-10-22, sends every request to the same path and query on
# the new host with a 301 ($request_uri carries both).
# Container on loopback :3009 (/home/devya/projects/devya-devyapos).
# Installed by `bash scripts/deploy.sh --setup`; certbot --nginx adds the TLS
# listeners and the HTTP→HTTPS redirect once DNS for both names points here.
# One certificate, named pos.movingsystems.tech, covers both names.
upstream devya_devyapos {
    server 127.0.0.1:3009;
    keepalive 32;
}
server {
    listen 80;
    server_name pos.movingsystems.tech;
    # No nginx version in the Server header or on error pages.
    server_tokens off;

    location / {
        proxy_pass http://devya_devyapos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
server {
    listen 80;
    server_name pos.devya.dev;
    server_tokens off;

    location / {
        return 301 https://pos.movingsystems.tech$request_uri;
    }
}
